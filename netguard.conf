# NetGuard rules - FIRST MATCH WINS. Normally managed from the GUI (http://127.0.0.1:8080).
# Rates are bit/s with k / M / G suffix. 'up' = local->remote, 'down' = remote->local.
# app= takes a program name (chrome.exe) or full path (quote it if it has spaces).
# ip= takes an address, CIDR, or: localhost, lan, any.  No ip/domain = all traffic.
#
# default=block blocks every app that has no Allow/Limit rule.
# A built-in DEFAULT WHITELIST is always checked before any rule below: DHCP, DHCPv6, DNS, ICMP, ICMPv6,
# Windows Time and PPP/VPN tunnel protocols. Turn one off with a line like:
#   system name=sys-ntp enabled=no
# (names: sys-dhcp sys-dhcpv6 sys-dns sys-icmp sys-icmpv6 sys-ntp sys-ppp - or untick them in the GUI "Defaults" tab)

global default=allow filtering=on queue_ms=250
